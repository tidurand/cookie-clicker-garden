<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍪 Jardin Cookie Clicker — Arbre des mutations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><img class="title-cookie" src="img/cookie.png" alt="🍪"> Arbre des mutations — Jardin Cookie Clicker</h1>
    <p class="subtitle">Quelles plantes croiser pour débloquer chaque graine</p>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="🔎 Rechercher un nom (FR ou EN)">
    <div class="filters">
      <button class="filter active" data-filter="all">Toutes</button>
      <button class="filter" data-filter="unlocked">✅ Obtenues</button>
      <button class="filter" data-filter="locked">⬜ À débloquer</button>
    </div>
  </div>

  <div class="progress">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-text"></span>
    <span id="timer" title="Temps écoulé depuis la dernière réinitialisation">⏱️ --:--:--</span>
    <button id="reset" title="Réinitialiser les cases et relancer le chrono">↺ Réinitialiser</button>
  </div>

  <main id="garden"></main>

  <footer>
    <p>Données : <a href="https://cookieclicker.wiki.gg/wiki/Garden" target="_blank" rel="noopener">Cookie Clicker Wiki — Garden</a>
       &amp; <a href="https://cookieclicker.wiki.gg/wiki/Garden_Strategies" target="_blank" rel="noopener">Garden Strategies</a>.
       État des cases sauvegardé localement dans votre navigateur.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
